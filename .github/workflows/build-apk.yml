name: Build MindGPT Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare Android Licenses, Signing and Secrets
        run: |
          # Automatically accept all Android SDK licenses
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b682569dd7e0844ac088e937473e54\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "893fb8b22d8222874f1dce324e1772298c43c3fe" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          # Prepare keystore safely
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Prepare .env for secrets plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
            if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            fi
          fi

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload MindGPT APK
        uses: actions/upload-artifact@v4
        with:
          name: MindGPT-android-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
