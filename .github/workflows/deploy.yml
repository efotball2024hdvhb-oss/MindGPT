name: Deploy to Cloudflare

# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CODECRAFT_API_KEY, D1_DATABASE_ID
on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: "Run initial D1 migration (first deploy only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Point config at real D1 / R2
        run: |
          f=dist/server/wrangler.json
          jq --arg id "${{ secrets.D1_DATABASE_ID }}" '
            .name = (.name // "mindgpt") |
            .d1_databases |= map(.database_id = $id | .database_name = "mindgpt-db") |
            .r2_buckets |= map(.bucket_name = "mindgpt-files")
          ' "$f" > tmp.json && mv tmp.json "$f"
          jq '{name, d1_databases, r2_buckets}' "$f"
      - name: Initial D1 migration
        if: ${{ inputs.run_migration }}
        run: npx wrangler d1 execute DB --remote -y --config dist/server/wrangler.json --file drizzle/0000_violet_blade.sql
      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Set API key secret
        run: echo "${{ secrets.CODECRAFT_API_KEY }}" | npx wrangler secret put CODECRAFT_API_KEY --config dist/server/wrangler.json
