name: Build Android APK

# Standalone APK: runs fully on the phone, no server needed.
# Users enter their API key in Settings → Model.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build web app (standalone)
        run: pnpm build:mobile

      - name: Version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create Android project (Capacitor)
        run: |
          set -euo pipefail
          mkdir -p apk && cd apk
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          rm -rf www && cp -r ../dist-mobile www
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.mindgpt.app",
            "appName": "MindGPT",
            "webDir": "www",
            "backgroundColor": "#000000",
            "android": { "allowMixedContent": false },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Icon, permissions, version
        run: |
          set -euo pipefail
          cd apk/android/app/src/main
          rm -rf res/mipmap-anydpi-v26
          for d in res/mipmap-*; do
            cp "$GITHUB_WORKSPACE/public/icon-512.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/public/icon-512.png" "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />#' AndroidManifest.xml
          V="${{ steps.v.outputs.version }}"
          sed -i "s/versionName \".*\"/versionName \"$V\"/" ../../build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" ../../build.gradle

      - name: Build APK
        run: |
          cd apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MindGPT-${{ steps.v.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MindGPT-apk
          path: MindGPT-*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-v{0}-{1}', steps.v.outputs.version, github.run_number) }}
          name: MindGPT Android ${{ steps.v.outputs.version }}
          body: |
            📱 فایل APK رو دانلود و نصب کن. بعد از نصب: تنظیمات ← مدل ← کلید API رو وارد کن.
          files: MindGPT-*.apk
